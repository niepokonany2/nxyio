name: beoffline
description: "beOFFline – więcej czasu poza ekranem."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_local_notifications: 17.2.3
  shared_preferences: ^2.5.6
  usage_stats: ^2.0.1
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/quiz/real/
    - assets/quiz/ai/
    - assets/black.png
    - assets/logo_biale.png    
  
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/black.png"