name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pobierz najnowszego stabilnego Fluttera
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable' 

      - name: Find, Fix and Build
        run: |
          echo "Szukanie pliku pubspec.yaml..."
          PROJECT_DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "BŁĄD: Nie znaleziono pubspec.yaml!"
            exit 1
          fi
          
          cd "$PROJECT_DIR"
          echo "Jestem w folderze: $PROJECT_DIR"
          
          # Usuwamy plik lock, żeby nie blokował nowych wersji
          rm -f pubspec.lock
          
          # Podmieniamy wersję usage_stats na 2.0.0 (bez daszka)
          sed -i '' 's/usage_stats:.*/usage_stats: 2.0.0/g' pubspec.yaml
          
          # Zmieniamy flutter_lints na starsze, żeby nie wymagało nieistniejącego Darta
          sed -i '' 's/flutter_lints:.*/flutter_lints: ^5.0.0/g' pubspec.yaml
          
          echo "=== SPRAWDZENIE CZY PLIK ZOSTAŁ ZMODYFIKOWANY ==="
          grep "usage_stats" pubspec.yaml
          grep "flutter_lints" pubspec.yaml
          echo "==================================================="
          
          echo "Uruchamianie flutter pub get..."
          flutter pub get
          
          echo "Uruchamianie build iOS..."
          flutter build ios --release --no-codesign -t lib/main.dart
          
          echo "Pakowanie do IPA..."
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r beoffline.ipa Payload
          
          echo "Przenoszenie pliku IPA do głównego katalogu..."
          mv beoffline.ipa $GITHUB_WORKSPACE/beoffline.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: beoffline-ipa
          path: beoffline.ipa
