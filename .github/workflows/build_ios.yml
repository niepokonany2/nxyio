name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # TO JEST NAJWAŻNIEJSZA LINIJKA - instaluje nowego Fluttera
      - name: Pobierz nowego Fluttera
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.0'

      - name: Find and Build
        run: |
          echo "Szukanie pliku pubspec.yaml..."
          PROJECT_DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "BŁĄD: Nie znaleziono pubspec.yaml w repozytorium!"
            exit 1
          fi
          
          echo "Znaleziono projekt w folderze: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          echo "Uruchamianie flutter pub get..."
          flutter pub get
          
          echo "Uruchamianie build iOS..."
          flutter build ios --release --no-codesign -t lib/main.dart
          
          echo "Pakowanie do IPA..."
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r beoffline.ipa Payload
          
          echo "Przenoszenie pliku IPA do głównego katalogu..."
          mv beoffline.ipa $GITHUB_WORKSPACE/beoffline.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: beoffline-ipa
          path: beoffline.ipa
