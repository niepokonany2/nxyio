name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./beoffline # <-- mówimy GitHubowi, żeby wchodził do folderu beoffline

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pobierz paczki
        run: flutter pub get

      - name: Zbuduj aplikację (bez podpisu)
        run: flutter build ios --release --no-codesign -t lib/main.dart

      - name: Spakuj do IPA
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr beoffline.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: beoffline-ipa
          path: beoffline/beoffline.ipa # <-- poprawiona ścieżka do gotowego pliku
