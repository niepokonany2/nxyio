name: Build Flutter iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Build iOS
        run: |
          echo "Szukanie projektu..."
          PROJECT_DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          cd "$PROJECT_DIR"
          
          rm -f pubspec.lock
          flutter pub get
          
          echo "=== PODPIĘCIE PLIKÓW SWIFT DO XCODE ==="
          cd ios
          gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            project = Xcodeproj::Project.open("Runner.xcodeproj")
            target = project.targets.find { |t| t.name == "Runner" }
            group = project.main_group.find_subpath("Runner", true)
            
            # Dodawanie plików Swift
            ["ScreenTimeManager.swift", "ScreenTimeReport.swift"].each do |file_name|
              file_ref = group.files.find { |f| f.path == file_name } || group.new_reference(file_name)
              target.add_file_references([file_ref]) unless target.source_build_phase.files_references.include?(file_ref)
            end

            # Linkowanie wymaganych frameworków Apple
            ["FamilyControls", "ManagedSettings", "DeviceActivity"].each do |fw|
              target.add_system_framework(fw)
            end
            project.save
          '
          cd ..
          
          echo "Budowanie iOS..."
          flutter build ios --release --no-codesign -t lib/main_ios.dart
          
          echo "Pakowanie do IPA..."
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r beoffline.ipa Payload
          mv beoffline.ipa $GITHUB_WORKSPACE/beoffline.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: beoffline-ipa
          path: beoffline.ipa
